<svg width="600" height="340" viewBox="0 0 600 340" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    text { font-family: 'Courier New', Courier, monospace; }
    .frame       { fill: #f5f7fa; stroke: #9baec8; stroke-width: 1.8; }
    .divider     { stroke: #9baec8; stroke-width: 1; }
    .val         { font-size: 20px; font-weight: 700; fill: #1a1a2e; text-anchor: middle; }
    .idx         { font-size: 12px; fill: #777777; text-anchor: middle; }
    .op          { font-size: 13px; font-weight: 700; fill: #777777; text-anchor: middle; }
    .note        { font-size: 13px; font-weight: 700; fill: #777777; text-anchor: start; }
    .top-label   { font-size: 13px; font-weight: 700; fill: #c0742a; text-anchor: middle; }
    .top-arrow   { stroke: #c0742a; stroke-width: 1.8; fill: none; }
    .top-arrow-fill { fill: #c0742a; }
    .wrap-line   { stroke: #c0742a; stroke-width: 1.8; fill: none; stroke-dasharray: 5,4; }
    .wrap-fill   { fill: #c0742a; }
    .wrap-label  { font-size: 12px; font-weight: 700; fill: #c0742a; text-anchor: middle; }
    @media (prefers-color-scheme: dark) {
      .frame       { fill: #1e2330; stroke: #4a6fa5; }
      .divider     { stroke: #4a6fa5; }
      .val         { fill: #e2e8f0; }
      .idx         { fill: #8899aa; }
      .op          { fill: #8899aa; }
      .note        { fill: #8899aa; }
      .top-label   { fill: #d4884a; }
      .top-arrow   { stroke: #d4884a; }
      .top-arrow-fill { fill: #d4884a; }
      .wrap-line   { stroke: #d4884a; }
      .wrap-fill   { fill: #d4884a; }
      .wrap-label  { fill: #d4884a; }
    }

    /* ---- animacion: ciclo de 12s, 10 pasos de 1.2s ---- */

    /* front avanza: slot 0 -> 1 -> 2 ; al final del ciclo vuelve al inicio */
    .ptr-front { animation: front-move 12s linear infinite; }
    @keyframes front-move {
      0%,    40%  { transform: translateX(0px); }
      42.5%, 50%  { transform: translateX(80px); }
      52.5%, 96%  { transform: translateX(160px); }
      100%        { transform: translateX(0px); }
    }

    /* rear apunta al proximo slot libre; en 80% da la vuelta (modulo) */
    .ptr-rear { animation: rear-move 12s linear infinite; }
    @keyframes rear-move {
      0%,    10%  { transform: translateX(0px); }
      12.5%, 20%  { transform: translateX(80px); }
      22.5%, 30%  { transform: translateX(160px); }
      32.5%, 60%  { transform: translateX(240px); }
      62.5%, 70%  { transform: translateX(320px); }
      72.5%, 80%  { transform: translateX(400px); }
      82.5%, 90%  { transform: translateX(0px); }
      92.5%, 96%  { transform: translateX(80px); }
      100%        { transform: translateX(0px); }
    }

    /* los elementos entran por rear (desde la derecha) y salen por front (hacia la izquierda) */
    .item { opacity: 0; }
    .item-a { animation: item-a 12s linear infinite; }
    @keyframes item-a {
      0%,   10%  { opacity: 0; transform: translateX(26px); }
      13%,  40%  { opacity: 1; transform: translateX(0px); }
      43%,  100% { opacity: 0; transform: translateX(-70px); }
    }
    .item-b { animation: item-b 12s linear infinite; }
    @keyframes item-b {
      0%,   20%  { opacity: 0; transform: translateX(26px); }
      23%,  50%  { opacity: 1; transform: translateX(0px); }
      53%,  100% { opacity: 0; transform: translateX(-70px); }
    }
    .item-c { animation: item-c 12s linear infinite; }
    @keyframes item-c {
      0%,   30%  { opacity: 0; transform: translateX(26px); }
      33%,  96%  { opacity: 1; transform: translateX(0px); }
      99%,  100% { opacity: 0; transform: translateX(0px); }
    }
    .item-d { animation: item-d 12s linear infinite; }
    @keyframes item-d {
      0%,   60%  { opacity: 0; transform: translateX(26px); }
      63%,  96%  { opacity: 1; transform: translateX(0px); }
      99%,  100% { opacity: 0; transform: translateX(0px); }
    }
    .item-e { animation: item-e 12s linear infinite; }
    @keyframes item-e {
      0%,   70%  { opacity: 0; transform: translateX(26px); }
      73%,  96%  { opacity: 1; transform: translateX(0px); }
      99%,  100% { opacity: 0; transform: translateX(0px); }
    }
    .item-f { animation: item-f 12s linear infinite; }
    @keyframes item-f {
      0%,   80%  { opacity: 0; transform: translateX(26px); }
      83%,  96%  { opacity: 1; transform: translateX(0px); }
      99%,  100% { opacity: 0; transform: translateX(0px); }
    }
    /* G entra en el slot 0, que quedo libre tras los dequeue: ahi se ve la reutilizacion */
    .item-g { animation: item-g 12s linear infinite; }
    @keyframes item-g {
      0%,   90%  { opacity: 0; transform: translateX(26px); }
      93%,  96%  { opacity: 1; transform: translateX(0px); }
      99%,  100% { opacity: 0; transform: translateX(0px); }
    }

    /* el arco del wrap-around se enciende justo cuando rear da la vuelta */
    .wrap { animation: wrap-flash 12s linear infinite; opacity: 0.16; }
    @keyframes wrap-flash {
      0%,  77%  { opacity: 0.16; }
      80%, 86%  { opacity: 1; }
      89%, 100% { opacity: 0.16; }
    }

    /* cada leyenda se muestra en su ventana de 1.2s via animation-delay */
    .cap { opacity: 0; animation: cap 12s linear infinite; }
    @keyframes cap {
      0%   { opacity: 0; }
      2%   { opacity: 1; }
      8.5% { opacity: 1; }
      10%  { opacity: 0; }
      100% { opacity: 0; }
    }
    .cap-1 { animation-delay: 0s; }
    .cap-2 { animation-delay: 1.2s; }
    .cap-3 { animation-delay: 2.4s; }
    .cap-4 { animation-delay: 3.6s; }
    .cap-5 { animation-delay: 4.8s; }
    .cap-6 { animation-delay: 6s; }
    .cap-7 { animation-delay: 7.2s; }
    .cap-8 { animation-delay: 8.4s; }
    .cap-9 { animation-delay: 9.6s; }
    .cap-10 { animation-delay: 10.8s; }

    /* sin animacion: se congela en el ultimo estado, que sigue siendo coherente */
    @media (prefers-reduced-motion: reduce) {
      .ptr-front { animation: none; transform: translateX(160px); }
      .ptr-rear  { animation: none; transform: translateX(80px); }
      .item      { animation: none; opacity: 0; }
      .item-c, .item-d, .item-e, .item-f, .item-g { opacity: 1; }
      .wrap      { animation: none; opacity: 1; }
      .cap       { animation: none; opacity: 0; }
      .cap-10    { opacity: 1; }
    }
  </style>

  <text x="60" y="32" class="note">capacidad: 6 · avanzan los índices, no los datos</text>

  <!-- puntero front: apunta al elemento mas antiguo -->
  <g class="ptr-front">
    <text x="100" y="84" class="top-label">front</text>
    <path d="M100,90 L100,104" class="top-arrow"/>
    <path d="M94,104 L100,112 L106,104 Z" class="top-arrow-fill"/>
  </g>

  <!-- arreglo de 6 slots -->
  <rect x="60" y="116" width="480" height="60" rx="8" class="frame"/>
  <line x1="140" y1="116" x2="140" y2="176" class="divider"/>
  <line x1="220" y1="116" x2="220" y2="176" class="divider"/>
  <line x1="300" y1="116" x2="300" y2="176" class="divider"/>
  <line x1="380" y1="116" x2="380" y2="176" class="divider"/>
  <line x1="460" y1="116" x2="460" y2="176" class="divider"/>

  <!-- contenido: cada elemento vive en un slot fijo y solo aparece/desaparece -->
  <text x="100" y="154" class="val item item-a">A</text>
  <text x="180" y="154" class="val item item-b">B</text>
  <text x="260" y="154" class="val item item-c">C</text>
  <text x="340" y="154" class="val item item-d">D</text>
  <text x="420" y="154" class="val item item-e">E</text>
  <text x="500" y="154" class="val item item-f">F</text>
  <text x="100" y="154" class="val item item-g">G</text>

  <text x="100" y="196" class="idx">0</text>
  <text x="180" y="196" class="idx">1</text>
  <text x="260" y="196" class="idx">2</text>
  <text x="340" y="196" class="idx">3</text>
  <text x="420" y="196" class="idx">4</text>
  <text x="500" y="196" class="idx">5</text>

  <!-- puntero rear: apunta al proximo slot libre -->
  <g class="ptr-rear">
    <path d="M100,206 L100,220" class="top-arrow"/>
    <path d="M94,214 L100,206 L106,214 Z" class="top-arrow-fill"/>
    <text x="100" y="238" class="top-label">rear</text>
  </g>

  <!-- arco del wrap-around: del ultimo slot al primero -->
  <g class="wrap">
    <path d="M500,256 C 470,292 130,292 100,268" class="wrap-line"/>
    <path d="M94,268 L100,256 L106,268 Z" class="wrap-fill"/>
    <text x="300" y="308" class="wrap-label">rear = (rear + 1) % 6</text>
  </g>

  <!-- leyenda: un paso por vez -->
  <text x="300" y="332" class="op cap cap-1">cola vacía · front == rear</text>
  <text x="300" y="332" class="op cap cap-2">enqueue(A)</text>
  <text x="300" y="332" class="op cap cap-3">enqueue(B)</text>
  <text x="300" y="332" class="op cap cap-4">enqueue(C)</text>
  <text x="300" y="332" class="op cap cap-5">dequeue() → A · sale el más antiguo</text>
  <text x="300" y="332" class="op cap cap-6">dequeue() → B</text>
  <text x="300" y="332" class="op cap cap-7">enqueue(D)</text>
  <text x="300" y="332" class="op cap cap-8">enqueue(E)</text>
  <text x="300" y="332" class="op cap cap-9">enqueue(F) · rear = (5 + 1) % 6 = 0</text>
  <text x="300" y="332" class="op cap cap-10">enqueue(G) · reutiliza el slot liberado</text>
</svg>
